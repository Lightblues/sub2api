[project]
name = "sub2api-inspector"
version = "0.1.0"
description = "Sub2API request log viewer and debugger"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "orjson>=3.10.0",
    "pyyaml>=6.0",
]

[project.scripts]
sub2api-inspector = "sub2api_inspector.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sub2api_inspector"]
