; =============================================================================
; Sub2API TI-ONE — supervisord 主配置
; =============================================================================
; 进程启动顺序(priority 数字越小越先起):
;   10  postgres       基础组件
;   20  redis          基础组件
;   25  youtu_proxy    sidecar (sub2api 启动时可能不需要它已 ready)
;   30  sub2api        业务主进程
;
; 所有日志统一写入 CFS: /data/sub2api/appdata/logs/
; 这样 Web 终端 / 下次开发机挂载 CFS 时都能看到历史日志
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/data/sub2api/appdata/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/data/sub2api/appdata/logs

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; -----------------------------------------------------------------------------
; PostgreSQL 16 (ubuntu 24.04 自带版本,sub2api 要求 15+ 兼容)
; -----------------------------------------------------------------------------
[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /data/sub2api/pgdata
user=postgres
autostart=true
autorestart=true
priority=10
startsecs=5
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/data/sub2api/appdata/logs/postgres.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/data/sub2api/appdata/logs/postgres.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

; -----------------------------------------------------------------------------
; Redis 7
; -----------------------------------------------------------------------------
[program:redis]
command=/usr/bin/redis-server
    --dir /data/sub2api/redis
    --appendonly yes
    --appendfsync everysec
    --save 300 10
    --bind 127.0.0.1
    --port 6379
    --protected-mode no
user=redis
autostart=true
autorestart=true
priority=20
startsecs=3
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/data/sub2api/appdata/logs/redis.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/data/sub2api/appdata/logs/redis.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

; -----------------------------------------------------------------------------
; youtu_llm_proxy  (FastAPI sidecar)
; -----------------------------------------------------------------------------
; 凭证由 entrypoint.sh 从 /data/sub2api/youtu_proxy/.env 加载后 export,
; supervisord 继承进程环境,无需显式 environment= 再次声明。
; -----------------------------------------------------------------------------
[program:youtu_proxy]
command=/usr/bin/python3 /opt/youtu_proxy/youtu_llm_proxy.py
    --host 127.0.0.1
    --port %(ENV_YOUTU_LLM_PROXY_PORT)s
    --env /data/sub2api/youtu_proxy/.env
directory=/opt/youtu_proxy
user=root
autostart=true
autorestart=true
priority=25
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/data/sub2api/appdata/logs/youtu_proxy.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/data/sub2api/appdata/logs/youtu_proxy.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3

; -----------------------------------------------------------------------------
; sub2api  (Go 主服务)
; -----------------------------------------------------------------------------
; 监听 8080,TI-ONE 控制台的 "容器端口" 配 8080 即可
; -----------------------------------------------------------------------------
[program:sub2api]
command=/app/sub2api
directory=/app
user=root
autostart=true
autorestart=true
priority=30
startsecs=10
startretries=10
stopsignal=TERM
stopwaitsecs=30
; PG 可能尚未 ready — 靠 autorestart + startretries 兜底
environment=HOME="/root"
stdout_logfile=/data/sub2api/appdata/logs/sub2api.out.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stderr_logfile=/data/sub2api/appdata/logs/sub2api.err.log
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=5

; -----------------------------------------------------------------------------
; 分组 — 方便 supervisorctl restart all
; -----------------------------------------------------------------------------
[group:sub2api-stack]
programs=postgres,redis,youtu_proxy,sub2api
priority=999
